<script>
var P = /*__DATA__*/null;

var OK = {blue:'#56B4E9', orange:'#E69F00', sky:'#8fd0f5', pink:'#CC79A7',
          verm:'#F0793B', yellow:'#F0E442', dim:'#9aa3b2', line:'#303642', tx:'#e8eaee',
          green:'#3ddc97', red:'#ff6b6b'};
function axStyle(){return {axisLine:{lineStyle:{color:OK.line}},axisTick:{lineStyle:{color:OK.line}},
  axisLabel:{color:OK.dim,fontSize:11},splitLine:{lineStyle:{color:'#252b35'}}};}
function tt(){return {trigger:'axis',backgroundColor:'#232933',borderColor:OK.line,
  textStyle:{color:OK.tx,fontSize:12},axisPointer:{lineStyle:{color:'#4a5364'}}};}
function mk(id){var el=document.getElementById(id);return el?echarts.init(el,null,{renderer:'canvas'}):null;}
function idx(W,date){for(var i=0;i<W.length;i++){if(W[i][0]>=date)return i;}return -1;}
function fmtD(s){return s.slice(0,7);}

/* ============ C0 全史价格 + 牛市阴影 ============ */
(function(){var ch=mk('c0');if(!ch)return;
  var d=P.px_all.map(function(r){return r[0];}),c=P.px_all.map(function(r){return r[1];});
  var areas=[];var cols=[OK.sky,OK.blue,OK.pink,OK.orange,OK.yellow,OK.verm,OK.sky,OK.blue,OK.orange,OK.pink,OK.verm];
  P.bulls.forEach(function(b,i){
    areas.push([{xAxis:b.low_d,itemStyle:{color:cols[i%cols.length]+'14'}},{xAxis:b.high_d}]);
  });
  ch.setOption({backgroundColor:'transparent',
    tooltip:Object.assign(tt(),{formatter:function(ps){var p=ps[0];return '<b>'+p.axisValue+'</b><br/>'+p.marker+'收盘：<b>'+p.value.toFixed(2)+' c/lb</b>';}}),
    grid:{left:58,right:30,top:30,bottom:60},
    dataZoom:[{type:'inside'},{type:'slider',height:18,bottom:14,borderColor:OK.line,

      textStyle:{color:OK.dim,fontSize:10}}],

      axisLabel:{color:OK.dim,fontSize:10,interval:Math.floor(d.length/12),formatter:fmtD}}),
    yAxis:Object.assign(axStyle(),{type:'log',logBase:10,name:'美分/磅（对数）',min:20,max:250,
      nameTextStyle:{color:OK.dim,fontSize:10}}),
    series:[{name:'收盘',type:'line',data:c,showSymbol:false,lineStyle:{width:1.5,color:OK.blue},
      itemStyle:{color:OK.blue},
      markArea:{silent:true,data:areas},
      markPoint:{symbolSize:1,data:[
        {coord:['2011-03-07',204.94],value:'219.7',itemStyle:{color:OK.verm},label:{show:true,formatter:'2011顶 219.70',color:OK.verm,fontSize:11,fontWeight:'bold',position:'top'}},
        {coord:['2022-05-02',143.61],value:'155.95',itemStyle:{color:OK.orange},label:{show:true,formatter:'2022顶 155.95',color:OK.orange,fontSize:10.5,position:'top'}},
        {coord:['2026-08-31',86.43],value:'93.74',itemStyle:{color:OK.yellow},label:{show:true,formatter:'本轮顶 93.74',color:OK.yellow,fontSize:10.5,position:'top'}},
        {coord:['2001-10-22',28.86],value:'28.2',itemStyle:{color:OK.green},label:{show:true,formatter:'2001底 28.20',color:OK.green,fontSize:10.5,position:'bottom'}}
      ]}}]});
  window.addEventListener('resize',function(){ch.resize();});})();

/* ============ C1 归一化叠加 ============ */
(function(){var ch=mk('c1');if(!ch)return;
  var cols={'1992-94 复苏牛':'#8fd0f5','1994-95 缺口牛':'#56B4E9','1995 逼空脉冲':'#CC79A7',
    '2001-03 复苏牛':'#E69F00','2004-08 商品牛':'#F0E442','2008-11 超级牛':'#F0793B',
    '2012-14 干旱牛':'#8fd0f5','2016-18 去库存牛':'#56B4E9','2020-22 疫情牛':'#E69F00',

  var series=P.norm.map(function(n){
    var data=n.pts.map(function(p){return [p[0],p[1]]});
    return {name:n.name,type:'line',data:data,showSymbol:false,
      lineStyle:{width:widths[n.name]||1.5,color:cols[n.name]||OK.dim,type:(n.name==='2025-26 本轮'?'solid':'solid')},
      itemStyle:{color:cols[n.name]||OK.dim},emphasis:{focus:'series'}};
  });
  ch.setOption({backgroundColor:'transparent',
    tooltip:Object.assign(tt(),{formatter:function(ps){
      var s='<b>距底部第 '+ps[0].value[0]+' 周</b><br/>';
      ps.sort(function(a,b){return b.value[1]-a.value[1];});
      ps.forEach(function(p){if(p.value&&p.value[1]!=null){
        s+=p.marker+p.seriesName+'：<b>'+(p.value[1]-100>=0?'+':'')+(p.value[1]-100).toFixed(1)+'%</b><br/>';}});
      return s;}}),
    legend:{data:P.norm.map(function(n){return n.name;}),textStyle:{color:OK.dim,fontSize:10.5},
      top:0,type:'scroll',pageTextStyle:{color:OK.dim},itemWidth:20,itemHeight:3},
    grid:{left:60,right:36,top:56,bottom:48},
    xAxis:Object.assign(axStyle(),{type:'value',name:'距底部周数',nameLocation:'middle',nameGap:28,
      nameTextStyle:{color:OK.dim,fontSize:11},min:0,max:200}),
    yAxis:Object.assign(axStyle(),{type:'value',name:'指数（底部收盘=100）',min:70,max:320,
      nameTextStyle:{color:OK.dim,fontSize:10}}),
    series:series});
  window.addEventListener('resize',function(){ch.resize();});})();

/* ============ dual() 价格×持仓双窗 ============ */
function dual(id,rows,cMain,cNet,cL,cS,marks){var ch=mk(id);if(!ch)return;
  var d=rows.map(function(r){return r[0];}),c=rows.map(function(r){return r[1];}),
      n=rows.map(function(r){return r[2];}),l=rows.map(function(r){return r[3];}),
      s=rows.map(function(r){return r[4];});
  ch.setOption({backgroundColor:'transparent',
    tooltip:Object.assign(tt(),{formatter:function(ps){
      var s2='<b>'+ps[0].axisValue+'</b><br/>';
      ps.forEach(function(p){var v=p.value;
        s2+=p.marker+p.seriesName+'：<b>'+(p.seriesName.indexOf('价格')>=0?
          v.toFixed(2)+' c/lb':(v>=0?'+':'')+v.toLocaleString()+' 手')+'</b><br/>';});
      return s2;}}),
    legend:{data:['价格（ICE 棉花 No.2）','非商业净持仓','非商业多头','非商业空头'],
      textStyle:{color:OK.dim,fontSize:11.5},top:4,itemWidth:24,itemHeight:3},
    grid:[{left:62,right:76,top:40,height:'42%'},{left:62,right:76,top:'58%',height:'32%'}],
    xAxis:[Object.assign(axStyle(),{type:'category',data:d,gridIndex:0,
        axisLabel:{show:false},boundaryGap:false}),
      Object.assign(axStyle(),{type:'category',data:d,gridIndex:1,boundaryGap:false,
        axisLabel:{color:OK.dim,fontSize:10,interval:Math.max(1,Math.floor(d.length/9)),formatter:fmtD}})],
    yAxis:[Object.assign(axStyle(),{type:'value',gridIndex:0,name:'美分/磅',scale:true,
        nameTextStyle:{color:OK.dim,fontSize:10}}),
      Object.assign(axStyle(),{type:'value',gridIndex:1,name:'手',
        nameTextStyle:{color:OK.dim,fontSize:10},
        axisLabel:{color:OK.dim,fontSize:10,formatter:function(v){return (v/10000).toFixed(1)+'万';}}})],
    series:[
      {name:'价格（ICE 棉花 No.2）',type:'line',xAxisIndex:0,yAxisIndex:0,data:c,showSymbol:false,
       lineStyle:{width:2.4,color:cMain},itemStyle:{color:cMain},
       areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[
         {offset:0,color:cMain+'30'},{offset:1,color:cMain+'05'}]}},
       markPoint:{data:marks,symbolSize:9}},
      {name:'非商业净持仓',type:'line',xAxisIndex:1,yAxisIndex:1,data:n,showSymbol:false,
       lineStyle:{width:2.3,color:cNet},itemStyle:{color:cNet},
       markLine:{silent:true,symbol:'none',lineStyle:{color:'#5b6577',type:'dashed',width:1},
         label:{color:OK.dim,fontSize:10,formatter:'0'},data:[{yAxis:0}]}},
      {name:'非商业多头',type:'line',xAxisIndex:1,yAxisIndex:1,data:l,showSymbol:false,
       lineStyle:{width:1.4,color:cL,type:'dotted'},itemStyle:{color:cL}},
      {name:'非商业空头',type:'line',xAxisIndex:1,yAxisIndex:1,data:s,showSymbol:false,
       lineStyle:{width:1.4,color:cS,type:'dashed'},itemStyle:{color:cS}}]});
  window.addEventListener('resize',function(){ch.resize();});}

function dualMark(rows,date){for(var i=0;i<rows.length;i++){if(rows[i][0]>=date)return i;}return 0;}
(function(){
  var cfg=[
    ['c2','2001-03 复苏牛',OK.orange,OK.pink,OK.sky,OK.blue,
      [['2001-10-22','底 28.86','bottom',OK.blue],['2003-10-27','顶 76.73｜净多峰 6 天前','top',OK.verm]]],
    ['c3','2008-11 超级牛',OK.blue,OK.pink,OK.sky,OK.orange,
      [['2008-11-10','底 42.51','bottom',OK.blue],['2010-09-14','净多峰 +8.4万手','top',OK.yellow],['2011-03-07','价峰 204.94（净多仅52%）','top',OK.verm]]],
    ['c4','2016-18 去库存牛',OK.blue,OK.pink,OK.sky,OK.orange,
      [['2016-02-29','底 57.11','bottom',OK.blue],['2017-03-07','净多峰 13.2万手（netOI 41.5%，历史极值）','top',OK.yellow],['2018-06-11','价峰 89.85（净多仍 96%）','top',OK.verm]]],
    ['c5','2020-22 疫情牛',OK.orange,OK.pink,OK.sky,OK.blue,
      [['2020-03-30','底 50.98','bottom',OK.blue],['2021-10-05','净多峰 +12.8万手','top',OK.yellow],['2022-05-02','价峰 143.61（净多 64%）','top',OK.verm]]],
    ['c6','2025-26 本轮',OK.yellow,OK.pink,OK.sky,OK.orange,
      [['2025-03-31','底 63.33（空头峰 13.1万手在前）','bottom',OK.blue],['2026-08-25','净多峰 +12.7万手','top',OK.yellow],['2026-08-31','价峰 86.43（净多=峰值100%）','top',OK.verm]]]
  ];
  cfg.forEach(function(k){
    var rows=P.duals[k[1]];if(!rows)return;
    var marks=k[6].map(function(m){var i=dualMark(rows,m[0]);
      return {coord:[i,rows[i][1]],itemStyle:{color:m[3]},
        label:{show:true,position:m[2],formatter:m[1],color:m[3],fontSize:10.5,fontWeight:'bold'}};});
    dual(k[0],rows,k[2],k[3],k[4],k[5],marks);
  });
})();

/* ============ C7 国别分解柱状 ============ */
(function(){var ch=mk('c7');if(!ch)return;
  var pick=['1992-94 复苏牛','2001-03 复苏牛','2004-08 商品牛','2008-11 超级牛','2016-18 去库存牛','2020-22 疫情牛','2025-26 本轮'];
  var dc=P.decomp.filter(function(x){return pick.indexOf(x.name)>=0;});
  var countries=['中国','印度','美国','巴西','巴基斯坦','澳大利亚','土耳其','乌兹别克斯坦','埃及'];
  var series=[];var cols=[OK.orange,OK.blue,OK.pink,OK.verm,OK.sky,OK.yellow,OK.green,'#b088e0','#8899aa'];
  dc.forEach(function(dd,k){
    series.push({name:dd.name,type:'bar',
      data:countries.map(function(cn){
        var r=dd.rows.find(function(x){return x.c===cn;});
        if(!r||r.chg==null)return null;
        return r.chg;
      }),
      itemStyle:{color:cols[k%cols.length]},barMaxWidth:14});
  });
  ch.setOption({backgroundColor:'transparent',
    tooltip:Object.assign(tt(),{formatter:function(ps){
      var s='<b>'+ps[0].axisValue+'</b>（千包，MY 窗口内产量变化）<br/>';
      ps.forEach(function(p){if(p.value!=null)s+=p.marker+p.seriesName+'：<b>'+(p.value>=0?'+':'')+p.value.toLocaleString()+'</b><br/>';});
      return s;}}),
    legend:{textStyle:{color:OK.dim,fontSize:10.5},top:0,type:'scroll',pageTextStyle:{color:OK.dim},itemWidth:16,itemHeight:9},
    grid:{left:70,right:30,top:52,bottom:40},
    xAxis:Object.assign(axStyle(),{type:'category',data:countries,
      axisLabel:{color:OK.dim,fontSize:11,interval:0,rotate:0}}),
    yAxis:Object.assign(axStyle(),{type:'value',name:'Δ产量（千包）',
      nameTextStyle:{color:OK.dim,fontSize:10},
      axisLabel:{color:OK.dim,fontSize:10,formatter:function(v){return (v/1000).toFixed(0)+'M';}}}),
    series:series});
  window.addEventListener('resize',function(){ch.resize();});})();

/* ============ C8 库存分层 ============ */

      return s;}}),

    xAxis:Object.assign(axStyle(),{type:'category',data:d,boundaryGap:false,

      {name:'剥中国 R1（库消比）',type:'line',data:r1,showSymbol:false,lineStyle:{width:2.4,color:OK.yellow},itemStyle:{color:OK.yellow}},
      {name:'剥中印 R2（库消比）',type:'line',data:r2,showSymbol:false,lineStyle:{width:1.8,color:OK.sky},itemStyle:{color:OK.sky}},

         {coord:['MY2013',w[P.layer.findIndex(function(r){return r[0]===2013;})]],label:{show:true,formatter:'全球峰值 88.4%\n（中国占65%）',color:OK.red,fontSize:10.5,position:'top'}}
       ]}}]});
  window.addEventListener('resize',function(){ch.resize();});})();

/* ============ C9 vintage SU 修订路径 ============ */
(function(){var ch=mk('c9');if(!ch)return;
  var order=['2010/11','2016/17','2020/21'];
  var cols={'2010/11':OK.verm,'2016/17':OK.blue,'2020/21':OK.orange};

    tooltip:Object.assign(tt(),{formatter:function(ps){
      var s='<b>第 '+ps[0].value[0]+' 次报告</b><br/>';

    legend:{data:order.map(function(m){return 'MY'+m;}),textStyle:{color:OK.dim,fontSize:11.5},top:4,itemWidth:24,itemHeight:3},

      nameTextStyle:{color:OK.dim,fontSize:10}}),

/* ============ C10 对齐散点：时滞 vs 净多留存 ============ */
(function(){var ch=mk('c10');if(!ch)return;
  var pts=P.align.filter(function(a){return a.lag_days<=500;});
  var cols={'1995 逼空脉冲':OK.pink,'2001-03 复苏牛':OK.orange,'2004-08 商品牛':OK.yellow,

      itemStyle:{color:cols[a.name]||OK.dim},

      markLine:{silent:true,symbol:'none',lineStyle:{color:'#5b6577',type:'dashed'},
        label:{color:OK.dim,fontSize:10},
        data:[{xAxis:14,label:{formatter:'2周'}},{yAxis:90,label:{formatter:'90%'}}]}}]});
