        if (order.indexOf(p.seriesName)<0) order.push(p.seriesName);
        var col = p.color;
        var val = (p.seriesName==='价格') ? p.value.toFixed(2) : fmtW(Math.round(p.value));
        var unit = (p.seriesName==='价格') ? (' '+(tab.priceUnit||'美分/磅')) : ' 手';
        if (!lines.html) lines.html = {};
        lines.html[p.axisValueLabel] = lines.html[p.axisValueLabel] || [];
        lines.html[p.axisValueLabel].push('<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+col+';margin-right:4px"></span>'+p.marker+p.seriesName+': <b>'+val+unit+'</b>');
      });
      var dateLabel = params[0].axisValueLabel || params[0].name;
      var h = '<div style="font-weight:700;margin-bottom:3px">'+dateLabel+'</div>';
      var seg = lines.html[dateLabel] || [];
      h += seg.join('<br>');
      evs.forEach(function(e){
        h += '<div style="margin-top:6px;padding:6px 8px;background:#fdf1ec;border:1px solid #D55E00;border-radius:6px;font-size:12px">'
           + '<div style="font-weight:700;color:#D55E00;margin-bottom:2px">● 多头增仓脉冲 · 单周 +'+fmtW(e.chg)+' 手（'+(tab.surgeBasis||'1986 年以来')+'第 '+e.rank+' 大）</div>'
           + '<div>多头总量：'+fmtW(e.L)+' 手　净多：'+fmtW(e.net)+' 手（/OI '+e.oip.toFixed(1)+'%）</div>'
           + '</div>';
      });
      return h;
    }
  };
  return {
    tooltip: tooltip,
    axisPointer:{link:[{xAxisIndex:'all'}]},
    grid: grids,
    xAxis: makeXAxis(x),
    yAxis: yAxis,
    dataZoom:[
      {type:'inside', xAxisIndex:[0,1,2,3], start:0, end:100},
      {type:'slider', xAxisIndex:[0,1,2,3], bottom:2, height:18, start:0, end:100}
    ],
    series:[
      Object.assign(seriesOpt('价格', close, '#12365e', 1.6), {xAxisIndex:0, yAxisIndex:0}),
      Object.assign(seriesOpt('非商业多头', nc_l, '#E69F00', 1.4), {xAxisIndex:1, yAxisIndex:1}),
      Object.assign(seriesOpt('非商业空头', nc_s, '#56B4E9', 1.4), {xAxisIndex:2, yAxisIndex:2}),
      Object.assign(seriesOpt('净多', nc_net, '#CC79A7', 1.6), {xAxisIndex:3, yAxisIndex:3})
    ].concat(scatterSeries)
  };
}

function renderCotTable(t){
  var s = COT_SNAP[curTab];
  function n(v){ return v.toLocaleString('en-US'); }
  function chip(v){
    var cls = v > 0 ? 'up' : (v < 0 ? 'dn' : 'z');
    var sign = v > 0 ? '+' : '';
    return '<span class="chip '+cls+'">'+sign+n(v)+'</span>';
  }
  function pct(v){ return (v / s.oi * 100).toFixed(1) + '%'; }
  var td = function(v, extra){ return '<td'+(extra||'')+'>'+v+'</td>'; };
  var tdc = function(v){ return '<td>'+chip(v)+'</td>'; };
  var gl = ' class="gl"';
  if (s.simple){
    var h='<div class="cot-wrap"><table class="cottbl">';
    h+='<tr><th class="grp" colspan="3">Non-Commercial</th><th class="grp gl" colspan="2">Commercial</th><th class="grp gl">Open Interest</th></tr>';
    h+='<tr><th class="sub">Long</th><th class="sub">Short</th><th class="sub">Spreads</th><th class="sub gl">Long</th><th class="sub">Short</th><th class="sub gl">Total</th></tr>';
    h+='<tr><td class="lab" colspan="5">(CONTRACTS OF '+s.unit+')</td><td class="rit">'+n(s.oi)+'</td></tr>';
    h+='<tr>'+td(n(s.vals[0]))+td(n(s.vals[1]))+td(n(s.vals[2]))+td(n(s.vals[3]),gl)+td(n(s.vals[4]))+td(n(s.oi),gl)+'</tr>';
    h+='<tr><td class="lab" colspan="5">Changes</td><td class="rit">OI: '+chip(s.chg_oi)+'</td></tr>';
    h+='<tr>'+tdc(s.chg[0])+tdc(s.chg[1])+tdc(s.chg[2])+tdc(s.chg[3])+tdc(s.chg[4])+tdc(s.chg_oi)+'</tr>';
    h+='<tr><td class="lab" colspan="6">Percent of Open Interest</td></tr><tr>'+td(pct(s.vals[0]))+td(pct(s.vals[1]))+td(pct(s.vals[2]))+td(pct(s.vals[3]),gl)+td(pct(s.vals[4]))+td('100.0%',gl)+'</tr>';
    h+='</table></div>';
    document.getElementById('cotCap').innerHTML='最新一期 CFTC COT（Legacy · Futures Only · Code '+s.code+'）· 截至 '+s.date+' · 单位 '+s.unit+' · 来源 CFTC';
    document.getElementById('cotTblWrap').innerHTML=h;
    return;
  }
  var h = '<div class="cot-wrap"><table class="cottbl">';
  // 表头两组
  h += '<tr><th class="grp" colspan="3">Non-Commercial</th><th class="grp gl" colspan="2">Commercial</th><th class="grp gl" colspan="2">Total</th><th class="grp gl" colspan="2">Non-Reportable</th></tr>';
  h += '<tr><th class="sub">Long</th><th class="sub">Short</th><th class="sub">Spreads</th><th class="sub gl">Long</th><th class="sub">Short</th><th class="sub gl">Long</th><th class="sub">Short</th><th class="sub gl">Long</th><th class="sub">Short</th></tr>';
  // 合约单位 + OI
  h += '<tr><td class="lab" colspan="5">(CONTRACTS OF '+s.unit+')</td><td class="rit" colspan="4">Open Interest: <b>'+n(s.oi)+'</b></td></tr>';
  // 持仓值
  h += '<tr>'+td(n(s.vals[0]), gl)+td(n(s.vals[1]))+td(n(s.vals[2]))+td(n(s.vals[3]), gl)+td(n(s.vals[4]))+td(n(s.vals[5]), gl)+td(n(s.vals[6]))+td(n(s.vals[7]), gl)+td(n(s.vals[8]))+'</tr>';
  // Changes + OI 变化
  h += '<tr><td class="lab" colspan="5">Changes</td><td class="rit" colspan="4">(Change In Open Interest: '+chip(s.chg_oi)+' )</td></tr>';
  h += '<tr>'+tdc(s.chg[0])+tdc(s.chg[1])+tdc(s.chg[2])+tdc(s.chg[3])+tdc(s.chg[4])+tdc(s.chg[5])+tdc(s.chg[6])+tdc(s.chg[7])+tdc(s.chg[8])+'</tr>';
  // 占 OI 比重
  h += '<tr><td class="lab" colspan="9">Percent of Open Interest for Each Category of Traders</td></tr>';
  h += '<tr>'+td(pct(s.vals[0]), gl)+td(pct(s.vals[1]))+td(pct(s.vals[2]))+td(pct(s.vals[3]), gl)+td(pct(s.vals[4]))+td(pct(s.vals[5]), gl)+td(pct(s.vals[6]))+td(pct(s.vals[7]), gl)+td(pct(s.vals[8]))+'</tr>';
  // 交易者数量
  h += '<tr><td class="lab" colspan="5">Number of Traders in Each Category</td><td class="rit" colspan="4">(Total Traders: '+s.totalTraders+')</td></tr>';
  var tr = s.traders;
  h += '<tr>'+td(tr[0], gl)+td(tr[1])+td(tr[2])+td(tr[3], gl)+td(tr[4])+td(tr[5], gl)+td(tr[6])+'<td'+gl+'></td><td></td></tr>';
  h += '</table></div>';
  document.getElementById('cotCap').innerHTML = '最新一期 CFTC COT（Legacy · Futures Only · Code '+s.code+'）· 截至 '+s.date+' · 来源 Tradingster/CFTC';
  document.getElementById('cotTblWrap').innerHTML = h;
}

  chart.clear();

  renderCotTable(t);
}
